    <script>
      // Suppress Vite HMR WebSocket connection failure as HMR is disabled in container/preview environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

  </body>
